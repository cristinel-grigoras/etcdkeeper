<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<title>ETCD Keeper</title>
	<link rel="shortcut icon" href="../etcdkeeper/framework/favicon.ico">
	<link rel="stylesheet" type="text/css" href="../etcdkeeper/framework/easyui/themes/metro/easyui.css">
	<link rel="stylesheet" type="text/css" href="../etcdkeeper/framework/easyui/themes/icon.css">
	<link rel="stylesheet" type="text/css" href="../etcdkeeper/framework/custom/css/style.css">
	<!-- 此行代码解决ie8中iframe里嵌套此页面会导致jquery错误-->
	<script>document.documentElement.focus();</script>
	<script type="text/javascript" src="../etcdkeeper/framework/easyui/jquery.min.js"></script>
	<script type="text/javascript" src="../etcdkeeper/framework/easyui/jquery.easyui.min.js"></script>
	<script type="text/javascript" src="../etcdkeeper/framework/easyui/locale/easyui-lang-en.js"></script>
	<script type="text/javascript" src="../etcdkeeper/framework/jquery/jquery.json-2.2.js"></script>
	<script type="text/javascript" src="../etcdkeeper/framework/custom/js/common.js"></script>
	<script type="text/javascript" src="../etcdkeeper/framework/js.cookie-2.1.4.min.js"></script>
	<script type="text/javascript" src="../etcdkeeper/framework/ace/ace.js" charset="utf-8"></script>
	<style>
		#value {
			position: absolute;
			top: 40px;
			right: 15px;
			bottom: 40px;
			left: 15px;
			border:1px solid #ddd;
			font-size: 13px!important;
		}
		#jsonStatus { margin-left: 20px; }
		#jsonStatus.ok { color: #2e7d32; }
		#jsonStatus.bad { color: #c62828; font-weight: bold; }
		.tree-more .tree-title { color: #00a0e9; font-style: italic; }
	</style>
</head>
<body style="overflow: hidden;">
	<h2><img src="../etcdkeeper/framework/logo.png" width="20" style="position:relative;top:3px;"></img><font color="00a0e9"> ETCD</font> Keeper <span id="ver" style="border: 1px solid #D4D4D4;border-radius: 5px;">v3</span></h2>
	<div class="noborder">
		<img id="userButton" src="../etcdkeeper/framework/easyui/themes/icons/user.png" width="20" style="position:relative;top:7px;cursor:pointer;"></img>
		<input id="etcdAddr" class="easyui-textbox" data-options="prompt:'127.0.0.1:2379',onChange:changeHost,iconCls:'icon-server',iconAlign:'left'" style="width:360px;height:30px;"/>
	</div>
	<div style="margin:20px 0;"></div>
	<div id="elayout" class="easyui-layout" style="width:100%;height:550px;">
		<div id="p" data-options="region:'west',tools:'#westTools'" title="Nodes" style="width:30%;padding:10px">
			<ul id="etree" class="easyui-tree"></ul>
		</div>
		<div data-options="region:'center',tools:'#centerTools',footer:'#footer'" title="/" spellcheck="false" style="padding:10px;overflow:hidden;">
			<div id="value"></div>
		</div>
	</div>

	<div id="footer" style="padding:5px;color:#777;"><span id="meta">&nbsp;</span><span id="jsonStatus"></span><span id="showMode" style="position: absolute;right: 10px;color: #777;"></span></div>
	<div id="westTools">
		<a href="javascript:void(0)" class="icon-path" style="margin-right:4px;" onclick="changeTreeMode();" title="Tree mode"></a>
		<a href="javascript:void(0)" class="icon-reload" onclick="connect();" title="Refresh tree"></a>
	</div>
	<div id="centerTools">
		<a href="javascript:void(0)" class="easyui-menubutton" style="width:60px;height:15px;" data-options="menu:'#modeMenu'">Mode</a>
		<a href="javascript:void(0)" class="icon-text" style="margin-right:4px;" onclick="format(aceMode);" title="Format content"></a>
		<a href="javascript:void(0)" class="icon-save" onclick="saveValue();" title="Save content"></a>
	</div>
	<div id="treeDirMenu" class="easyui-menu" style="width:150px;">
		<div onclick="$('#cnode').window('open')" data-options="iconCls:'icon-add'">Create Node</div>
		<div onclick="removeNode()" data-options="iconCls:'icon-remove'">Remove Node</div>
	</div>
	<div id="treeNodeMenu" class="easyui-menu" style="width:150px;">
		<div onclick="removeNode()" data-options="iconCls:'icon-remove'">Remove Node</div>
	</div>

	<div id="cnode" class="easyui-window" title="Create node" data-options="modal:true,closed:true" style="width:650px;height:480px;padding:10px;">
		<div style="padding:10px 40px 20px 40px">
			<form id="cnodeForm">
				<table cellpadding="10">
					<tr>
						<td>Name:</td>
						<td><input id="name" class="easyui-textbox" type="text" name="name" data-options="required:true" style="width:450px;"/></td>
					</tr>
					<tr>
						<td>Dir:</td>
						<td>
							<select id="dir" class="easyui-combobox" name="dir" data-options="panelHeight:'auto',onSelect:selDir" style="width:70px;">
								<option value="true">TRUE</option>
								<option value="false" selected="selected">FALSE</option>
							</select>
						</td>
					</tr>
					<tr>
						<td>TTL:</td>
						<td><input id="ttl" class="easyui-numberbox" type="text" name="ttl" data-options="" style="width:450px;"/></td>
					</tr>
					<tr>
						<td>Value:</td>
						<td spellcheck="false"><textarea id="cvalue" class="easyui-textbox" name="value" data-options="multiline:true" style="width:450px;height:200px"></textarea></td>
					</tr>
				</table>
			</form>
			<div style="text-align:center;padding:5px">
				<a href="javascript:void(0)" class="easyui-linkbutton" onclick="createNode()">Submit</a>
			</div>
	    </div>
	</div>

	<div id="userinfo" class="easyui-window" title="Authentication" data-options="modal:true,closed:true" style="width:350px;height:220px;padding:10px;">
		<div style="padding:10px 40px 20px 40px">
			<table cellpadding="10">
				<tr>
					<td>Username:</td>
					<td><input id="uname" class="easyui-textbox" type="text" name="uname" data-options="required:true" style="width:120px;"/></td>
				</tr>
				<tr>
					<td>Password:</td>
					<td><input id="passwd" class="easyui-textbox" type="password" name="passwd" data-options="required:true" style="width:120px;"/></td>
				</tr>
			</table>
			<div style="text-align:center;padding:5px">
				<a href="javascript:void(0)" class="easyui-linkbutton" onclick="userOK()">Submit</a>
			</div>
	    </div>
	</div>

	<div style="text-align:right;color:#BDBDBD;margin-top:2px;">
		<span id="statusVersion"></span>
		<span id="statusSize" style="margin-left: 10px;"></span>
		<span id="statusMember" style="margin-left: 10px;"></span>
		<span id="keeperVersion" style="margin-left: 10px;">ETCD Keeper</span>
	</div>

	<div id="modeMenu" style="">
		<div id="mode_text" onclick="changeMode('text')">text</div>
		<div id="mode_toml" onclick="changeMode('toml')">toml</div>
		<div id="mode_ini" onclick="changeMode('ini')">ini</div>
		<div id="mode_yaml" onclick="changeMode('yaml')">yaml</div>
		<div id="mode_xml" onclick="changeMode('xml')">xml</div>
		<div id="mode_lua" onclick="changeMode('lua')">lua</div>
		<div id="mode_javascript" onclick="changeMode('javascript')">javascript</div>
		<div id="mode_json" onclick="changeMode('json')">json</div>
	</div>

	<script>
		resizeWindow();
		$(window).resize(function(){ // FIXME: invalid
			resizeWindow();
		});

		function resizeWindow(){
			$('#elayout').height(($(window).height() - 128) + 'px')
		}

		var timeout = 30000 // milliseconds; trees are paged, so one request stays small
		var separator = '';
		var serverBase = '../v3';
		var etcdBase = Cookies.get('etcd-endpoint');
		if(typeof(etcdBase) === 'undefined') {
			etcdBase = '127.0.0.1:2379';
		}

		$(function(){
			$('#userButton').bind('click',function(e){
				$('#userinfo').window('open');
			});
			$.get('../version', function(v) {
				$('#keeperVersion').text('ETCD Keeper ' + v);
			}, 'text');
		});

		var tree = [];
		var idCount = 0;
		var editor = ace.edit('value');
		editor.$blockScrolling = Infinity;
		var curIconMode = 'mode_icon_text';
		// aceMode is the mode in use; userMode is the one picked in the Mode menu (kept in a cookie).
		// A value that looks like JSON is shown in json mode without changing userMode.
		var userMode = Cookies.get('ace-mode');
		if (typeof(userMode) === 'undefined') {
			userMode = 'text';
		}
		var aceMode = userMode;
		var treeMode = Cookies.get('tree-mode');
		if (typeof(treeMode) === 'undefined') {
			treeMode = 'list';
		}
		var jsonCheckTimer = null;
		editor.getSession().on('change', function() {
			clearTimeout(jsonCheckTimer);
			jsonCheckTimer = setTimeout(updateJsonStatus, 300);
		});

		// get separator
		$.ajax({
			type: 'GET',
			timeout: timeout,
			url:  serverBase + '/separator',
			async: false,
			dataType: 'text',
			success: function(data) {
				separator = data;
				console.log(data);
			},
			error: function(err) {
				$.messager.alert('Error', $.toJSON(err), 'error');
			}
		});

		$(document).ready(function() {
			editor.setTheme('ace/theme/github');
			setEditorMode(aceMode);
			init();
		});

		function init() {
			$('#etcdAddr').textbox('setValue', etcdBase);
			var t = $('#etree').tree({
				animate:true,
				onClick:showNode,
				//lines:true,
				onContextMenu:showMenu
			});
		}

		function changeHost(newValue, oldValue) {
			if (newValue === '') {
				$.messager.alert('Error','ETCD address is empty.','error');
			}else {
				Cookies.set('etcd-endpoint', newValue, {expires: 30});
				etcdBase = newValue;
				connect();
			}
		}

		function connect() {
			var status = 'ok';
			var uname = $('#uname').textbox('getValue');
			var passwd = $('#passwd').textbox('getValue');
			$.ajax({
				type: 'POST',
				timeout: timeout,
				url:  serverBase + '/connect',
				data: {'host': etcdBase, 'uname': uname, 'passwd': passwd},
				async: false,
				dataType: 'json',
				success: function(data) {
					if (data.status === 'ok') {
						console.log('Connect etcd success.');
						//alertMessage('Connect etcd success.');
					} else if (data.status === 'running') {
						console.log('Etcd is running.');
					} else if (data.status === 'login') {
						console.log('User login required.');
						status = 'login';
					} else if (data.status === 'root') {
						console.log('Need to set root.');
						status = 'root';
					} else {
						$.messager.alert('Error', data.message, 'error');
						status = 'error';
					}
					if (data.info) {
						$('#statusVersion').html('ETCD version:' + data.info.version);
						$('#statusSize').html('Size:' + data.info.size);
						$('#statusMember').html('Member name:' + data.info.name);
					} else {
						$('#statusVersion').html('');
						$('#statusSize').html('');
						$('#statusMember').html('');
					}
				},
				error: function(err) {
					$.messager.alert('Error', $.toJSON(err), 'error');
				}
			});

			if (status === 'ok') {
				reload();
			} else if (status === 'login') {
				$('#userinfo').window('open');
			} else if (status === 'root') {
				$('#userinfo').window('open');
				$.messager.alert('Warning', 'The server needs to initialize the root user.');
			} else {
				resetValue();
				$('#etree').tree('loadData', []);
			}
		}

		function reload() {
			var rootNode = {
				id      : getId(),
				children: [],
				dir     : true,
				path    : separator,
				text    : separator,
				iconCls : 'icon-dir'
			};
			tree = [];
			tree.push(rootNode);
			$('#etree').tree('loadData', tree);
			showNode($('#etree').tree('getRoot'));
			resetValue();
		}

		function resetValue() {
			$('#elayout').layout('panel','center').panel('setTitle', separator);
			editor.getSession().setValue('');
			editor.setReadOnly(false);
			$('#meta').html('&nbsp;');
			updateJsonStatus();
		}

		function showNode(node) {
			if (node.more) {
				loadMore(node);
				return;
			}
			$('#elayout').layout('panel','center').panel('setTitle', node.path);
			editor.getSession().setValue('');
			if (node.dir === false) {
				editor.setReadOnly(false);
				$.ajax({
					type: 'GET',
					timeout: timeout,
					url:  serverBase + '/get',
					data: {'key': node.path},
					async: true,
					dataType: 'json',
					success: function(data) {
						if (data.errorCode) {
							$('#etree').tree('remove', node.target);
							console.log(data.message);
							resetValue()
						} else {
							editor.getSession().setValue(data.node.value);
							var ttl = 0;
							if (data.node.ttl) {
								ttl = data.node.ttl;
							}
							changeFooter(ttl, data.node.createdIndex, data.node.modifiedIndex);
							pickModeForValue(node.path, data.node.value);
						}
					},
					error: function(err) {
						$.messager.alert('Error',$.toJSON(err),'error');
					}
				});
			} else {
				if (node.children.length > 0) {
					$('#etree').tree(node.state === 'closed' ? 'expand' : 'collapse', node.target);
				}

				$('#meta').html('&nbsp;');
				// direct children only (getChildren would return the whole subtree)
				var children = directChildren(node);
				fetchChildren(node.path, '', function(data) {
					if (data.node.value) {
						editor.getSession().setValue(data.node.value);
						changeFooter(data.node.ttl, data.node.createdIndex, data.node.modifiedIndex);
						pickModeForValue(node.path, data.node.value);
					}
					for (var n in children) {
						$('#etree').tree('remove', children[n].target);
					}
					appendChildren(node, data.node);
				});
			}
		}

		// fetchChildren loads one page of children of key; after is the cursor of the previous page.
		function fetchChildren(key, after, done) {
			$.ajax({
				type: 'GET',
				timeout: timeout,
				url:  serverBase + (treeMode === 'list' ? '/get' : '/getpath'),
				data: {'key': key, 'prefix': 'true', 'after': after},
				async: true,
				dataType: 'json',
				success: function(data) {
					if (data.errorCode) {
						$.messager.alert('Error', data.message, 'error');
					} else {
						done(data);
					}
				},
				error: function(err) {
					$.messager.alert('Error',$.toJSON(err),'error');
				}
			});
		}

		// appendChildren adds one page under parent, merging a key that was a leaf on an
		// earlier page and turns out to be a directory, and ends with a "load more" node.
		function appendChildren(parent, page) {
			var existing = {};
			var siblings = directChildren(parent);
			for (var s in siblings) {
				existing[siblings[s].path] = siblings[s];
			}
			var arr = [];
			for (var i in page.nodes) {
				var n = page.nodes[i];
				var old = existing[n.key];
				if (old) {
					if (n.dir && !old.dir) {
						$('#etree').tree('update', {target: old.target, iconCls: 'icon-dir', state: 'closed'});
						old.dir = true;
					}
					continue;
				}
				arr.push(getNode(n));
			}
			if (page.more) {
				arr.push({
					id:      getId(),
					text:    'load more ...',
					iconCls: 'icon-more',
					more:    true,
					next:    page.next,
					parentPath: page.key,
					children: []
				});
			}
			if (arr.length > 0) {
				$('#etree').tree('append', {parent: parent.target, data: arr});
			}
			if (page.more) {
				var kids = directChildren(parent);
				$(kids[kids.length - 1].target).addClass('tree-more');
			}
		}

		function directChildren(node) {
			var all = $('#etree').tree('getChildren', node.target);
			var direct = [];
			for (var i in all) {
				if ($('#etree').tree('getParent', all[i].target).id === node.id) {
					direct.push(all[i]);
				}
			}
			return direct;
		}

		function loadMore(moreNode) {
			var parent = $('#etree').tree('getParent', moreNode.target);
			$('#etree').tree('update', {target: moreNode.target, text: 'loading ...'});
			fetchChildren(moreNode.parentPath, moreNode.next, function(data) {
				$('#etree').tree('remove', moreNode.target);
				appendChildren(parent, data.node);
			});
		}

		function getNode(n) {
			var text = '';
			if (treeMode === 'list') {
				text = n.key;
			} else {
				var path = n.key.split(separator);
				text = path[path.length - 1];
			}
			var obj = {
				id  :    getId(),
				text:    text,
				dir:     false,
				iconCls: 'icon-text',
				path:    n.key,
				children:[]
			};
			if (n.dir === true) {
				obj.state = 'closed';
				obj.dir = true;
				obj.iconCls = 'icon-dir';
				if (n.nodes) {
					for (var i in n.nodes) {
						var rn = getNode(n.nodes[i]);
						obj.children.push(rn);
					}
				}
			}
			return obj
		}

		function showMenu(e, node) {
			e.preventDefault();
			if (node.more) {
				return;
			}
			$('#etree').tree('select',node.target);
			var mid = "treeNodeMenu";
			if (treeMode === 'path' || node.dir === true) {
				mid = 'treeDirMenu';
			}
			$('#' + mid).menu('show',{
				left: e.pageX,
				top: e.pageY
			});
		}

		function saveValue() {
			var node = $('#etree').tree('getSelected');
			if (node === null || node.more) {
				return;
			}
			var value = editor.getValue();
			if (aceMode === 'json' || looksLikeJson(value)) {
				var err = jsonError(value);
				if (err !== null) {
					editor.gotoLine(err.line, err.column - 1, true);
					editor.focus();
					$.messager.confirm('Invalid JSON', escapeHtml(err.text) + '<br><br>Save anyway?', function(r) {
						if (r) {
							putValue(node, value);
						}
					});
					return;
				}
			}
			putValue(node, value);
		}

		function putValue(node, value) {
			$.ajax({
				type: 'PUT',
				timeout: timeout,
				url:  serverBase + '/put',
				data: {'key': node.path, 'value': value},
				async: true,
				dataType: 'json',
				success: function(data) {
					if (data.errorCode) {
						$.messager.alert('Error', data.message, 'error');
					} else {
						editor.getSession().setValue(data.node.value);
						var ttl = 0;
						if (data.node.ttl) {
							ttl = data.node.ttl;
						}
						changeFooter(ttl, data.node.createdIndex, data.node.modifiedIndex);
						alertMessage('Save success.');
					}
				},
				error: function(err) {
					$.messager.alert('Error',$.toJSON(err),'error');
				}
			});
		}

		// createNode checks a JSON-looking value (or a *.json name) before creating the key.
		function createNode() {
			var value = $('#cvalue').textbox('getValue');
			var name = $('#name').textbox('getValue').trim();
			var isDir = $('#dir').combobox('getValue') === 'true';
			if (!isDir && (looksLikeJson(value) || /\.json$/i.test(name))) {
				var err = jsonError(value);
				if (err !== null) {
					$.messager.confirm('Invalid JSON', escapeHtml(err.text) + '<br><br>Create anyway?', function(r) {
						if (r) {
							doCreateNode();
						}
					});
					return;
				}
			}
			doCreateNode();
		}

		function doCreateNode() {
			var node = $('#etree').tree('getSelected');
			var nodePath = node.path;
			if (nodePath === separator) {
				nodePath = ''
			}

			if (treeMode == 'list') { // list mode
				if ($('#cnodeForm').form('validate')) {
					var createNodePath = $('#name').textbox('getValue').trim();
					if (!createNodePath.startsWith(separator)) {
						createNodePath= separator + $('#name').textbox('getValue').trim();
					}
					$.ajax({
						type: 'PUT',
						timeout: timeout,
						url:  serverBase + '/put',
						data: {'key':createNodePath,'value':$('#cvalue').textbox().val(),'ttl':$('#ttl').numberbox().val()},
						async: true,
						dataType: 'text',
						success: function(data) {
							$('#cnode').window('close');
							var ret = $.evalJSON(data);
							if (ret.errorCode) {
								$.messager.alert('Error', ret.message, 'error');
							}else {
								alertMessage('Create success.');
								var newData = [];
								var obj = {
											id  :    getId(),
											text:    createNodePath,
											state:   $('#dir').combobox('getValue') === 'true'?'closed':'',
											dir:     $('#dir').combobox('getValue') === 'true',
											iconCls: $('#dir').combobox('getValue') === 'true'?'icon-dir':'icon-text',
											path:    createNodePath,
											children:[]
										};
								var objNode = nodeExist(obj.path);
								if (objNode === null) {
									newData.push(obj);

									$('#etree').tree('append', {
										parent: node.target,
										data: newData
									});
								}
							}
							$('#cvalue').textbox('enable','none');
							$('#cnodeForm').form('reset');
							$('#ttl').numberbox('setValue', '');
						},
						error: function(err) {
							$.messager.alert('Error', err, 'error');
						}
					});
				}
			} else { // dir mode
				if ($('#cnodeForm').form('validate')) {
					var pathArr = [];
					var inputArr = $('#name').textbox('getValue').trim().split(separator);
					for (var i in inputArr) {
						if ($.trim(inputArr[i]) != '') {
							pathArr.push(inputArr[i]);
						}
					}

					$.ajax({
						type: 'PUT',
						timeout: timeout,
						url:  serverBase + '/put',
						data: {dir:$('#dir').combobox('getValue'),'key':nodePath + separator + pathArr.join(separator),'value':$('#cvalue').textbox().val(),'ttl':$('#ttl').numberbox().val()},
						async: true,
						dataType: 'text',
						success: function(data) {
							$('#cnode').window('close');
							var ret = $.evalJSON(data);
							if (ret.errorCode) {
								$.messager.alert('Error', ret.message, 'error');
							}else {
								alertMessage('Create success.');
								var newData = [];
								var preObj = {};
								var prePath = node.path;
								for (var k in pathArr) {
									var obj = {};
									if (k == pathArr.length - 1) {
										obj = {
											id  :    getId(),
											text:    pathArr[k],
											state:   $('#dir').combobox('getValue') == 'true'?'open':'',
											dir:     $('#dir').combobox('getValue') == 'true'?true:false,
											iconCls: $('#dir').combobox('getValue') == 'true'?'icon-dir':'icon-text',
											path:    (prePath==separator?(prePath + ''):(prePath + separator)) + pathArr[k],
											children:[]
										};
									} else {
										obj = {
											id  :    getId(),
											text:    pathArr[k],
											state:   'closed',
											dir:     true,
											iconCls: 'icon-dir',
											path:    (prePath==separator?(prePath + ''):(prePath + separator)) + pathArr[k],
											children:[]
										};
									}
									var objNode = nodeExist(obj.path);
                                    if (objNode != null) {
                                        node = objNode;
                                        prePath = node.path;
                                        continue;
                                    }
									if (newData.length === 0) {
										newData.push(obj);
									} else {
										preObj.children.push(obj);
									}
									preObj = obj;
									prePath = obj.path;
								}
								$('#etree').tree('update', {
									target: node.target,
									iconCls: 'icon-dir'
								});
                                $('#etree').tree('append', {
									parent: node.target,
									data: newData
								});
							}

							$('#cvalue').textbox('enable','none');
							$('#cnodeForm').form('reset');
							$('#ttl').numberbox('setValue', '');
						},
						error: function(err) {
							$.messager.alert('Error', err, 'error');
						}
					});
				}
			}
		}

		function nodeExist(p) {
			for (var i=0;i<=idCount;i++) {
				var node = $('#etree').tree('find', i);
				if (node !== null && node.path === p) {
					return node;
				}
			}
			return null;
		}

		function removeNode() {
			var node = $('#etree').tree('getSelected');
			$.messager.confirm('Confirm', 'Remove ' + node.text + '?', function(r){
				if (r){
					$.ajax({
						type: 'POST',
						timeout: timeout,
						url:  serverBase + '/delete',
						data: {'key': node.path, 'dir':node.dir},
						async: true,
						dataType: 'text',
						success: function(data) {
							resetValue();
							if (data === 'ok') {
								alertMessage('Delete success.');

								var pnode = $('#etree').tree('getParent', node.target);

								$('#etree').tree('remove', node.target);

								var isLeaf = $('#etree').tree('isLeaf', pnode.target);
								if (isLeaf && pnode.text !== separator) {
									$('#etree').tree('update', {
										target: pnode.target,
										iconCls: 'icon-text'
									});
								}
							} else {
								$.messager.alert('Error', data, 'error');
							}
						},
						error: function(err) {
							$.messager.alert('Error', $.toJSON(err), 'error');
						}
					});
				}
			});
		}

		function selDir(item) {
			if (item.value === 'true') {
				$('#cvalue').textbox('disable','none');
			}else {
				$('#cvalue').textbox('enable','none');
			}
		}

		function alertMessage(msg) {
			$.messager.show({
				title:'Message',
				msg:msg,
				showType:'slide',
				timeout:1000,
				style:{
					right:'',
					bottom:''
				}
			});
		}

		function getId() {
			return idCount++;
		}

		// changeMode is the Mode menu: the choice is remembered in a cookie.
		function changeMode(mode) {
			userMode = mode;
			Cookies.set('ace-mode', userMode, {expires: 30});
			setEditorMode(mode);
		}

		function setEditorMode(mode) {
			aceMode = mode;
			$('#' + curIconMode).remove();
			editor.getSession().setMode('ace/mode/' + aceMode);
			curIconMode = 'mode_icon_' + aceMode;
			$('#mode_' + mode).append('<div id="' + curIconMode + '" class="menu-icon icon-ok"></div>');
			$('#showMode').html(aceMode);
			updateJsonStatus();
		}

		function changeFooter(ttl, cIndex, mIndex) {
			$('#meta').html('TTL&nbsp;:&nbsp;' + ttl + '&nbsp;&nbsp;&nbsp;&nbsp;CreateRevision&nbsp;:&nbsp;' + cIndex + '&nbsp;&nbsp;&nbsp;&nbsp;ModRevision&nbsp;:&nbsp;' + mIndex);
			$('#showMode').html(aceMode);
		}

		function format(type) {
			if (type === 'json' || looksLikeJson(editor.getValue())) {
				var err = jsonError(editor.getValue());
				if (err !== null) {
					editor.gotoLine(err.line, err.column - 1, true);
					$.messager.alert('Invalid JSON', escapeHtml(err.text), 'error');
					return;
				}
				editor.setValue(JSON.stringify(JSON.parse(editor.getValue()), null, 4));
				setEditorMode('json');
				editor.clearSelection();
				editor.navigateFileStart();
			}
		}

		function changeTreeMode() {
			if (treeMode === 'list') {
				treeMode = 'path';
			} else {
				treeMode = 'list';
			}
			Cookies.set('tree-mode', treeMode, {expires: 30});
			connect();
		}

		// pickModeForValue: a known file suffix wins, then JSON-looking content, else the menu choice.
		function pickModeForValue(path, value) {
			var a = path.split(separator);
			var tokens = a[a.length - 1].split('.');
			if (tokens.length >= 2) {
				var suffix = tokens[tokens.length - 1];
				var modes = $('#modeMenu').children();
				for (var i = 0; i < modes.length; i++) {
					if (modes[i].innerText === suffix) {
						setEditorMode(suffix);
						return;
					}
				}
			}
			setEditorMode(looksLikeJson(value) ? 'json' : userMode);
		}

		function looksLikeJson(text) {
			var t = $.trim(text || '');
			return t.charAt(0) === '{' || t.charAt(0) === '[';
		}

		// jsonError returns null for valid JSON, else {text, line, column} (1-based). The position
		// comes from a small scanner because browsers word (and sometimes omit) it differently.
		function jsonError(text) {
			try {
				JSON.parse(text);
				return null;
			} catch (e) {
				var at = jsonErrorOffset(text);
				var before = text.substring(0, at).split('\n');
				var line = before.length, column = before[before.length - 1].length + 1;
				var near = text.substring(at, at + 20).split('\n')[0];
				var where = at >= text.length ? ' (unexpected end)' : (near ? ' near "' + near + '"' : ' (at end of line)');
				// the browser's own wording, minus the position and quoted input it may append
				var why = e.message.split('\n')[0].replace(/ in JSON at position.*$/, '').replace(/, (\.\.\.)?".*$/, '');
				return {
					text: 'line ' + line + ' column ' + column + where + ': ' + why,
					line: line,
					column: column
				};
			}
		}

		// jsonErrorOffset returns the offset where a strict JSON parse first fails.
		function jsonErrorOffset(t) {
			var i = 0;
			function fail() { throw i; }
			function ws() { while (i < t.length && ' \t\n\r'.indexOf(t.charAt(i)) >= 0) i++; }
			function lit(w) { if (t.substr(i, w.length) !== w) fail(); i += w.length; }
			function str() {
				i++;
				while (i < t.length) {
					var c = t.charAt(i);
					if (c === '"') { i++; return; }
					if (c < ' ') fail();
					if (c === '\\') {
						i++;
						var esc = t.charAt(i);
						if (esc === 'u') { if (!/^[0-9a-fA-F]{4}$/.test(t.substr(i + 1, 4))) fail(); i += 4; }
						else if ('"\\/bfnrt'.indexOf(esc) < 0 || esc === '') fail();
					}
					i++;
				}
				fail();
			}
			function num() {
				var m = /^-?(0|[1-9]\d*)(\.\d+)?([eE][+-]?\d+)?/.exec(t.substring(i));
				if (m === null || m[0] === '' || m[0] === '-') fail();
				i += m[0].length;
			}
			function val() {
				ws();
				var c = t.charAt(i);
				if (c === '{') {
					i++; ws();
					if (t.charAt(i) === '}') { i++; return; }
					for (;;) {
						ws(); if (t.charAt(i) !== '"') fail(); str();
						ws(); if (t.charAt(i) !== ':') fail(); i++;
						val(); ws();
						if (t.charAt(i) === ',') { i++; continue; }
						if (t.charAt(i) === '}') { i++; return; }
						fail();
					}
				} else if (c === '[') {
					i++; ws();
					if (t.charAt(i) === ']') { i++; return; }
					for (;;) {
						val(); ws();
						if (t.charAt(i) === ',') { i++; continue; }
						if (t.charAt(i) === ']') { i++; return; }
						fail();
					}
				} else if (c === '"') { str(); }
				else if (c === 't') { lit('true'); }
				else if (c === 'f') { lit('false'); }
				else if (c === 'n') { lit('null'); }
				else { num(); }
			}
			try {
				val(); ws();
				return i < t.length ? i : t.length;
			} catch (pos) {
				return typeof pos === 'number' ? pos : 0;
			}
		}

		function updateJsonStatus() {
			var el = $('#jsonStatus');
			var value = editor.getValue();
			if (aceMode !== 'json' || $.trim(value) === '') {
				el.removeClass('ok bad').text('');
				return;
			}
			var err = jsonError(value);
			if (err === null) {
				el.removeClass('bad').addClass('ok').text('JSON valid');
			} else {
				el.removeClass('ok').addClass('bad').text('JSON error: ' + err.text);
			}
		}

		function escapeHtml(s) {
			return $('<div>').text(s).html();
		}

		function userOK() {
			$('#userinfo').window('close');
			connect();
		}
	</script>
</body>
</html>
